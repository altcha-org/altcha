<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="https://altcha.org/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ALTCHA HIS Recorder</title>
		<style>
			body {
				font-family: system-ui, sans-serif;
				margin: 2rem auto;
				max-width: 40rem;
				padding: 0 1rem;
			}
			form {
				display: flex;
				flex-direction: column;
				gap: 1rem;
			}
			pre {
				background: #f4f4f4;
				max-height: 24rem;
				overflow: auto;
				padding: 1rem;
			}
		</style>
	</head>
	<body>
		<h1>HIS Recorder</h1>
		<p>
			Fill in the form naturally and click the checkbox. The collected HIS payload appears below and
			can be downloaded as a fixture.
		</p>
		<form>
			<input name="email" type="email" placeholder="Email" />
			<textarea name="message" rows="4" placeholder="Message"></textarea>
			<altcha-widget challenge="/his-recorder/challenge"></altcha-widget>
			<button type="submit">Submit</button>
		</form>
		<pre id="out"></pre>
		<button id="download" type="button">Download</button>
		<script type="module" src="/his-recorder.ts"></script>
	</body>
</html>
